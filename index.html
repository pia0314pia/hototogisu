<style>
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #fdfaf5; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        color: #333; overflow: hidden; touch-action: none;
    }
    
    #game-board {
        display: none; /* JSで表示 */
        flex-direction: column; align-items: center; justify-content: space-between;
        width: 100%; height: 100%; padding: 4vh 10px; box-sizing: border-box;
    }
    
    #title-area {
        font-size: 32px; font-weight: bold; background: #2c3e50; color: #fff;
        padding: 10px 30px; border: 2px solid #d4af37; border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center;
    }
    ruby { ruby-position: over; }
    #char-jo-wrapper { position: relative; display: inline-block; }
    #char-onna, #char-kuchi { display: none; position: absolute; bottom: 0; transition: transform 0.5s; }
    #char-onna { left: 0; }
    #char-kuchi { left: 50%; cursor: grab; z-index: 100; touch-action: none; }
    
    #center-area {
        flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; width: 100%;
    }
    #bird { position: relative; width: 220px; height: 220px; }
    .bird-svg-container { width: 100%; height: 100%; pointer-events: none; position: absolute; top:0; left:0; }
    .bird-part { transition: transform 0.6s ease-out; }
    .bird-left { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); display: none; }
    .bird-right { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); display: none; }
    .cut-left { transform: translateX(-50px) rotate(-15deg); }
    .cut-right { transform: translateX(50px) rotate(15deg); }

    #note {
        position: absolute; font-size: 18px; font-weight: bold; color: #ff4081;
        background: rgba(255, 255, 255, 0.95); border: 2px solid #ff4081;
        padding: 5px 10px; border-radius: 20px; top: -10px; right: -30px;
        opacity: 0; transition: opacity 0.5s, transform 0.5s;
    }
    .singing { opacity: 1 !important; transform: translateY(-10px) rotate(5deg); }

    #kanji-naku {
        display: none; font-size: 150px; font-weight: bold;
        background: linear-gradient(to bottom, #d4af37, #b8860b);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    @keyframes combineAnim {
        0% { transform: scale(0.2); opacity: 0; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
    }

    #bottom-area { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    #sword { width: 100px; height: 100px; cursor: grab; position: relative; z-index: 200; touch-action: none; }
    #reset-btn {
        padding: 10px 30px; font-size: 16px; font-weight: bold; cursor: pointer;
        background-color: #4a4a4a; color: white; border: 2px solid #333; border-radius: 6px;
    }

    #result-modal {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
        background: #fdfaf5; padding: 30px; border-radius: 12px; text-align: center; border: 4px solid #d4af37;
    }
    #modal-text { font-size: 28px; font-weight: bold; color: #d32f2f; margin: 15px 0 25px; }
    .modal-buttons { display: flex; justify-content: center; gap: 15px; }
    .btn { padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; color:#fff; border:none; }
    #share-x-btn { background: #000; }
    #modal-close-btn { background: #2c3e50; }

    @media screen and (min-width: 768px) {
        #title-area { font-size: 42px; }
        #bird { width: 260px; height: 260px; }
        #sword { width: 130px; height: 130px; }
        #kanji-naku { font-size: 200px; }
    }
</style>
</head>
